name: Publish image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-image
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Test service
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          go vet ./...
          go test ./...
      - name: Fetch verified FFmpeg source
        run: |
          mkdir -p build
          curl --fail --location --retry 3 -o build/ffmpeg-8.0.1.tar.xz https://ffmpeg.org/releases/ffmpeg-8.0.1.tar.xz
          echo '05ee0b03119b45c0bdb4df654b96802e909e0a752f72e4fe3794f487229e5a41  build/ffmpeg-8.0.1.tar.xz' | sha256sum -c -
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/outmost9271/honor-aak-an00-workflow:0.3.0
            ghcr.io/outmost9271/honor-aak-an00-workflow:latest
            ghcr.io/outmost9271/honor-aak-an00-workflow:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
